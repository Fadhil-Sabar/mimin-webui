<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<!-- One request for both families, narrowed to the weights the MD3 scale actually
		     uses: 400 and 500 (there are no 600/700 roles). Roboto keeps the italic axis
		     because the transcript and markdown render <em> text; Newsreader does not
		     use italics. `opsz` stays variable on Newsreader. -->
		<link
			href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..500&family=Roboto:ital,wght@0,400..500;1,400..500&display=swap"
			rel="stylesheet"
		/>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('theme');
					var theme =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.setAttribute('data-theme', theme);
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'light');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
