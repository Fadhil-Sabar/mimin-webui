name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mimin
          POSTGRES_PASSWORD: mimin
          POSTGRES_DB: mimin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mimin -d mimin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: PostgreSQL and pgvector integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://mimin:mimin@127.0.0.1:5432/mimin_test
          DATABASE_URL: postgres://mimin:mimin@127.0.0.1:5432/mimin_test
      - name: Build
        run: npm run build
      - name: Check bundle budget
        run: npm run bundle:budget
      - name: Dependency audit
        run: npm audit --audit-level=high
