name: Bug report
description: Report a reproducible problem
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'Do not report security vulnerabilities here. Use the private process in SECURITY.md.'
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Start...\n2. Open...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version or commit
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, deployment method, and relevant provider without credentials.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove API keys, cookies, tokens, private URLs, document content, and personal data.
      render: shell
