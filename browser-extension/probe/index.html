<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Mimin injected-script probe</title>
	</head>
	<body>
		<main>
			<h1>Mimin injected-script probe</h1>
			<p>Autonomous agents require deterministic tool gating across every turn.</p>
			<a id="docs-link" href="/docs/tool-gating">Tool gating docs</a>
			<button id="signin" type="button">Sign in</button>
			<button id="disabled-btn" type="button" disabled>Disabled action</button>
			<input id="email" type="text" placeholder="Email address" />
			<input type="hidden" name="csrf" value="secret-token" />
			<select id="plan">
				<option value="free">Free</option>
				<option value="pro">Pro</option>
			</select>
			<div id="hidden-wrap" style="display: none">
				<button id="hidden-btn">Never visible</button>
			</div>
			<div role="button" id="custom-control">Custom control</div>
			<input id="stubborn" type="text" placeholder="A search box this page never reacts to" />
			<p id="probe-note">Fingerprint baseline.</p>
			<pre id="probe-output">probe did not run</pre>
		</main>
		<!-- Generated by `npm run extension:probe` from src/background-core.js. -->
		<script src="injected.js"></script>
		<script>
			window.__events = [];
			for (const id of ['signin', 'disabled-btn', 'hidden-btn']) {
				document
					.getElementById(id)
					.addEventListener('click', () => window.__events.push('click:' + id));
			}
			const email = document.getElementById('email');
			email.addEventListener('input', (e) => window.__events.push('input:' + e.target.value));
			email.addEventListener('change', (e) => window.__events.push('change:' + e.target.value));
			document
				.getElementById('plan')
				.addEventListener('change', (e) => window.__events.push('select:' + e.target.value));
			document.addEventListener('keydown', (e) => window.__events.push('keydown:' + e.key));
			document
				.getElementById('custom-control')
				.addEventListener('click', () => window.__events.push('click:custom'));
			document.getElementById('docs-link').addEventListener('click', (e) => {
				e.preventDefault();
				window.__events.push('click:docs-link');
			});

			(function runProbe() {
				const lines = [];
				const check = (name, condition, detail) => {
					lines.push(
						(condition ? 'PASS ' : 'FAIL ') + name + (detail === undefined ? '' : ' :: ' + detail)
					);
				};
				const byId = (snapshot, id) =>
					snapshot.elements.find(
						(e) => typeof e.selector === 'string' && e.selector.endsWith('#' + id)
					);
				const refOf = (snapshot, id) => {
					const match = byId(snapshot, id);
					return match ? match.ref : 'no-ref';
				};
				const applied = (r) => (typeof r.ref === 'number' ? 'number' : typeof r.ref);

				const snap = pageSnapshot({ google: false });
				window.__miminSnap = snap;
				check(
					'snapshot text includes article copy',
					snap.text.includes('deterministic tool gating')
				);
				check('snapshot has no captcha flag', snap.captcha === false);
				check(
					'snapshot includes https link',
					snap.links.some((l) => l.url === location.origin + '/docs/tool-gating'),
					JSON.stringify(snap.links.map((l) => l.url))
				);
				check('elements are indexed', snap.elements.length > 0, snap.elements.length + ' refs');

				check(
					'button present',
					snap.elements.some((e) => e.tag === 'button' && e.name === 'Sign in')
				);
				check(
					'email input present',
					snap.elements.some((e) => e.tag === 'input' && e.name === 'Email address')
				);
				check(
					'select present',
					snap.elements.some((e) => e.tag === 'select')
				);
				check(
					'hidden input excluded',
					!snap.elements.some((e) => e.name === 'csrf' && e.tag === 'input')
				);
				check(
					'display:none button excluded',
					!snap.elements.some((e) => e.name === 'Never visible')
				);
				check('aria role button present', Boolean(byId(snap, 'custom-control')));
				check(
					'every emitted selector resolves back to an element',
					snap.elements.every((e) => !e.selector || document.querySelector(e.selector) !== null),
					JSON.stringify(
						snap.elements
							.filter((e) => e.selector && !document.querySelector(e.selector))
							.map((e) => e.selector)
					)
				);
				check(
					'emitted selectors are id-anchored',
					Boolean(byId(snap, 'signin')) && Boolean(byId(snap, 'email')),
					byId(snap, 'signin') && byId(snap, 'signin').selector
				);
				check(
					'refs are numeric',
					snap.elements.every((e) => typeof e.ref === 'number'),
					applied(snap.elements[0])
				);

				const disabledRef = byId(snap, 'disabled-btn');
				check(
					'disabled flag reported',
					Boolean(disabledRef && disabledRef.disabled === true),
					disabledRef && String(disabledRef.disabled)
				);

				// Click by ref
				window.__events.length = 0;
				let r = interactPage({ action: 'click', ref: refOf(snap, 'signin') });
				check('click by ref reports ok', r.ok === true, JSON.stringify(r));
				check(
					'click by ref fired handler',
					window.__events.includes('click:signin'),
					JSON.stringify(window.__events)
				);

				// Type into input with submit
				window.__events.length = 0;
				r = interactPage({
					action: 'type',
					ref: refOf(snap, 'email'),
					text: 'agent@example.com',
					submit: true
				});
				check('type reports ok', r.ok === true, JSON.stringify(r));
				check(
					'typed value applied',
					document.getElementById('email').value === 'agent@example.com',
					document.getElementById('email').value
				);
				check(
					'input + change events dispatched',
					window.__events.includes('input:agent@example.com') &&
						window.__events.includes('change:agent@example.com'),
					JSON.stringify(window.__events)
				);
				check(
					'submit pressed Enter',
					window.__events.includes('keydown:Enter'),
					JSON.stringify(window.__events)
				);

				// Select by ref
				window.__events.length = 0;
				r = interactPage({ action: 'select', ref: refOf(snap, 'plan'), value: 'pro' });
				check('select reports ok', r.ok === true, JSON.stringify(r));
				check(
					'select changed value',
					document.getElementById('plan').value === 'pro',
					document.getElementById('plan').value
				);
				check(
					'select change event dispatched',
					window.__events.includes('select:pro'),
					JSON.stringify(window.__events)
				);

				// Press key
				window.__events.length = 0;
				document.getElementById('email').focus();
				r = interactPage({ action: 'press', key: 'Tab' });
				check('press reports ok', r.ok === true, JSON.stringify(r));
				check(
					'press dispatched keydown',
					window.__events.includes('keydown:Tab'),
					JSON.stringify(window.__events)
				);

				// Hover
				r = interactPage({ action: 'hover', ref: refOf(snap, 'custom-control') });
				check('hover reports ok', r.ok === true, JSON.stringify(r));

				// Scroll
				r = interactPage({ action: 'scroll', direction: 'down', amount: 200 });
				check('scroll reports ok', r.ok === true, JSON.stringify(r));

				// Click by visible text fallback
				window.__events.length = 0;
				r = interactPage({ action: 'click', text: 'custom control' });
				check('click by text reports ok', r.ok === true, JSON.stringify(r));
				check(
					'click by text fired handler',
					window.__events.includes('click:custom'),
					JSON.stringify(window.__events)
				);

				// Click by selector fallback
				window.__events.length = 0;
				r = interactPage({ action: 'click', selector: '#docs-link' });
				check('click by selector reports ok', r.ok === true, JSON.stringify(r));
				check(
					'click by selector fired handler',
					window.__events.includes('click:docs-link'),
					JSON.stringify(window.__events)
				);

				// Typing by label, without a ref, must reach a real field: the label
				// fallback used to exclude inputs, so this could never work.
				const emailField = document.getElementById('email');
				emailField.value = '';
				r = interactPage({ action: 'type', text: 'Email address' });
				check('type by label finds a field without a ref', r.ok === true, JSON.stringify(r));
				check(
					'type by label wrote into that field',
					emailField.value === 'Email address',
					emailField.value
				);

				// A click by label must not land on a text field.
				window.__events.length = 0;
				r = interactPage({ action: 'click', text: 'Never visible' });
				check('click by label ignores hidden buttons', r.ok === false, JSON.stringify(r));

				// Failure paths
				r = interactPage({ action: 'click', ref: 9999 });
				check(
					'bad ref fails cleanly',
					r.ok === false && typeof r.error === 'string',
					JSON.stringify(r)
				);
				r = interactPage({ action: 'click', selector: '#does-not-exist' });
				check('missing selector fails cleanly', r.ok === false, JSON.stringify(r));
				r = interactPage({ action: 'teleport' });
				check('unknown action fails cleanly', r.ok === false, JSON.stringify(r));

				// A ref from a document that has not been read is reported as stale, with
				// the remedy, instead of a dead end.
				const savedRefs = window.__miminElementRefs;
				window.__miminElementRefs = undefined;
				r = interactPage({ action: 'click', ref: 0 });
				check(
					'missing registry reports a stale ref with a remedy',
					r.ok === false && /Read the tab again/.test(String(r.error)),
					JSON.stringify(r)
				);
				window.__miminElementRefs = savedRefs;

				// Refs survive a full snapshot refresh (staleness contract)
				const second = pageSnapshot({ google: false });
				r = interactPage({ action: 'click', ref: refOf(second, 'signin') });
				check('refs from a fresh snapshot still work', r.ok === true, JSON.stringify(r));

				// Page fingerprints used to tell a real interaction from one a site ignored
				const digestA = pageDigest();
				const digestB = pageDigest();
				check(
					'digest is stable while the page is unchanged',
					digestA.hash === digestB.hash && digestA.url === digestB.url,
					JSON.stringify(digestA)
				);
				const probeText = document.getElementById('probe-note');
				probeText.textContent = 'changed by the probe';
				const digestC = pageDigest();
				check(
					'digest changes when the page text changes',
					digestC.hash !== digestA.hash,
					JSON.stringify({ before: digestA.hash, after: digestC.hash })
				);

				// A site that accepts the DOM write but ignores scripted input: the
				// fingerprint must stay identical, which is what makes the tool report
				// "nothing changed" instead of a false success.
				const stubborn = document.getElementById('stubborn');
				const digestBeforeIgnored = pageDigest();
				interactPage({
					action: 'type',
					ref: refOf(pageSnapshot({ google: false }), 'stubborn'),
					text: 'ignored',
					submit: true
				});
				check(
					'scripted typing reaches the stubborn input',
					stubborn.value === 'ignored',
					stubborn.value
				);
				const digestAfterIgnored = pageDigest();
				check(
					'ignored interaction leaves the fingerprint unchanged',
					digestAfterIgnored.hash === digestBeforeIgnored.hash,
					JSON.stringify({ before: digestBeforeIgnored.hash, after: digestAfterIgnored.hash })
				);

				const failed = lines.filter((l) => l.startsWith('FAIL'));
				lines.push('');
				lines.push(
					'SUMMARY ' + (lines.length - 1 - failed.length) + ' passed, ' + failed.length + ' failed'
				);
				document.getElementById('probe-output').textContent = lines.join('\n');
			})();
		</script>
	</body>
</html>
